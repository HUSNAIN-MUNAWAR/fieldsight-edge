name: FieldSight Edge CI
on:
  push:
  pull_request:

jobs:
  api-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. alembic upgrade head
      - run: PYTHONPATH=. python scripts/seed_demo.py
      - run: PYTHONPATH=. python scripts/migration_status.py
      - run: PYTHONPATH=. ruff check app tests
      - run: PYTHONPATH=. pytest -q

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  browser-and-accessibility-boundary:
    runs-on: ubuntu-latest
    needs: [api-quality, web-quality]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install -r apps/api/requirements.txt
      - run: npm --prefix apps/web ci
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: |
          cd apps/api
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. python scripts/seed_demo.py
          PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          cd ../web
          npm run test:e2e
